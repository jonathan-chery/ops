[project]
name = "ops"
version = "0.1.0"
description = "Proxmox LXC Orchestrator"
dependencies = [
    "typer[all]",
    "pydantic",
    "proxmoxer",
    "requests",
    "requests-unixsocket",
    "pyyaml",
    "infisicalsdk",
    "paramiko",
    "cryptography",
    "keyring",
    "jinja2",
    "psycopg2-binary",
    "zeroconf",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
    "setuptools",
    "wheel",
]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
    "pytest-cov",
]

[project.scripts]
ops = "ops.cli:app"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ops*"]

[tool.pyinstaller]
hiddenimports = [
    "proxmoxer.backends.https",
]

data_files = [
    "src/ops/blueprints/*.yaml",
    "src/ops/blueprints/templates/*.tpl",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
show_error_codes = true
