site_name: Ops CLI
site_description: "Proxmox LXC Orchestrator CLI documentation"

site_url: https://jonathan-chery.github.io/ops/
repo_url: https://github.com/jonathan-chery/ops
repo_name: jonathan-chery/ops
edit_uri: blob/main/docs/

copyright: "© 2026 Ops CLI Contributors"

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - Architecture: architecture.md
  - Features:
      - features/phased-deployments.md
      - features/blueprints.md
      - features/secrets.md
      - features/clustering.md
      - features/microvm-firecracker.md
  - Guides:
      - guides/first-deployment.md
      - guides/docker-compose-app.md
      - guides/native-systemd-app.md
      - guides/multi-node-cluster.md
      - guides/firecracker-workload.md
  - Reference:
      - reference/cli-commands.md
      - reference/config.md
      - reference/blueprints-reference.md
      - reference/models.md
  - Blueprints Gallery: blueprints-gallery.md
  - Templates Gallery: templates-gallery.md
  - Changelog: changelog.md
  - Roadmap: ROADMAP.md


theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - minify:
      minify_html: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jonathan-chery/ops
  version:
    provider: mike

extra_css:
  - assets/css/custom.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
