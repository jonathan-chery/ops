name: deep-research
template: debian-12-standard
resources:
  cores: 2
  memory: 4096
  disk: 20
env_vars:
  - DEEP_RESEARCH_API_KEY
  - OPENAI_API_KEY
install_steps:
  - apt-get update && apt-get install -y git curl wget build-essential python3
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
  - npm install -g pnpm
  - git clone --branch v1.2.0 https://github.com/AnotiaWang/deep-research-web-ui.git /opt/deep-research
  - cd /opt/deep-research && pnpm install --frozen-lockfile
  - cd /opt/deep-research && NODE_OPTIONS='--max-old-space-size=3072' NEXT_TELEMETRY_DISABLED=1 pnpm build
services:
  - name: deep-research
    exec: /usr/bin/npm run start
    cwd: /opt/deep-research
